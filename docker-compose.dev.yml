# ============================================================
# 開発用 compose（WSL 上でのローカル開発）
#
#   起動:  docker compose -f docker-compose.dev.yml up
#   停止:  Ctrl+C もしくは docker compose -f docker-compose.dev.yml down
#
# ソースをバインドマウントしてホットリロードが効く。
# DB ポート(5432)はホストにも公開するので、GUI ツールから接続可能。
# ============================================================

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # バインドマウントにより /app/media はホストの ./media に対応する
      MEDIA_DIR: /app/media
      # 環境によってはファイル監視にポーリングが必要（効かない場合に有効化）
      # WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      # ソースをマウントして編集を即反映
      - .:/app
      # node_modules と .next はコンテナ内のものを使う（ホストで上書きしない）
      - /app/node_modules
      - /app/.next

volumes:
  pgdata-dev:
