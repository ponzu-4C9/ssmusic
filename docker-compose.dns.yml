# 家庭内 split DNS（任意）。LAN内の端末が music.shirai-dev.com を
# 「サーバーのLAN IP」に解決できるようにする。
#
# 事前に .env: DOMAIN と LAN_IP を設定（LAN_IP = ip route get 1.1.1.1 | grep -oP 'src \K\S+'）。
# 起動: docker compose -f docker-compose.dns.yml up -d
# その後、各端末（スマホ/PC）の DNS を LAN_IP に向ける。
#
# なぜ network_mode: host なのか:
#   Docker のポート公開(ブリッジ)経由だと、dnsmasq の既定の local-service が
#   「LAN(別サブネット)からの問い合わせ」を無視してしまい、PC等から引けない。
#   host ネットワーク＋ --bind-interfaces --listen-address=<LAN_IP> で、
#   LAN IP に直接バインドし local-service を無効化して LAN から応答できるようにする。
#   （--listen-address を LAN_IP だけにすることで systemd-resolved の 127.0.0.53:53 とも競合しない）
#
# ※ サーバーの LAN IP は固定（DHCP予約 or 静的）にしておくこと。

services:
  dns:
    image: 4km3/dnsmasq:2.90-r3
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - --keep-in-foreground
      - --no-resolv
      - --no-hosts
      - --bind-interfaces
      - --listen-address=${LAN_IP}
      - --address=/${DOMAIN}/${LAN_IP}
      - --server=1.1.1.1
      - --server=8.8.8.8
